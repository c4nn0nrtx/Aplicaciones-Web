<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

<main class="auth-container">
    <section class="auth-card">

        <h2>Iniciar Sesión</h2>

        <form class="auth-form" method="post" action="/autenticacion">

            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>

            <div class="form-buttons">
                <button type="submit">Iniciar Sesión</button>
                <button type="reset">Cancelar</button>
            </div>

        </form>

    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
