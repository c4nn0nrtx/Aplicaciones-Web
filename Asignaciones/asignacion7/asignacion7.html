<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d0d1a;
        }

        .grid-container {
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-rows: 70px 60px 1fr 60px;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header  header"
                "nav     nav"
                "aside   main"
                "footer  footer";
            gap: 8px;
            padding: 8px;
        }

        header {
            grid-area: header;
            background-color: #9c27b0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        nav {
            grid-area: nav;
            background-color: #7b1fa2;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        aside {
            grid-area: aside;
            background-color: #ab47bc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        main {
            grid-area: main;
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        .content {
            background-color: #6a1b9a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            width: 100%;
            height: 100%;
        }

        .section {
            background-color: #4a148c;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            width: 100%;
            height: 100%;
        }

        footer {
            grid-area: footer;
            background-color: #ce93d8;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <header>Header</header>
        <nav>Navigation</nav>
        <aside>Aside</aside>
        <main>
            <div class="content">Content</div>
            <div class="section">Section</div>
        </main>
        <footer>Footer</footer>
    </div>

</body>
</html>
